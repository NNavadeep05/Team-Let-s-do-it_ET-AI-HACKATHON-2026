# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# prepend the current directory to the sys.path
prepend_sys_path = .

# version path separator; as of alembic 1.11.0, this defaults to 'os'
version_path_separator = os

# logging configuration
# [loggers]
# keys = root,sqlalchemy,alembic

# [handlers]
# keys = console

# [formatters]
# keys = generic

# [logger_root]
# level = INFO
# handlers = console
# qualname =

# [logger_sqlalchemy]
# level = WARN
# handlers =
# qualname = sqlalchemy.engine

# [logger_alembic]
# level = INFO
# handlers =
# qualname = alembic

# [handler_console]
# class = StreamHandler
# args = (sys.stdout,)
# level = NOTSET
# formatter = generic

# [formatter_generic]
# format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
# datefmt = %H:%M:%S
