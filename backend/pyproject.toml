[tool.poetry]
name = "neuron-backend"
version = "0.1.0"
description = "NEURON IQ FastAPI Backend Service"
authors = ["Lead Engineer <lead@neuron.iq>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.2.1"
neo4j = "^5.18.0"
qdrant-client = "^1.8.0"
redis = "^5.0.3"
celery = "^5.3.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
openai = "^1.14.1"
google-generativeai = "^0.4.1"
pymupdf = "^1.23.26"
pytesseract = "^0.3.10"
pdfplumber = "^0.11.0"
camelot-py = {extras = ["cv"], version = "^0.11.0"}
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
mail-parser = "^3.15.0"
fastembed = "^0.2.2"
FlagEmbedding = "^1.2.6"
langgraph = "^0.0.32"
langchain-core = "^0.1.33"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
opentelemetry-sdk = "^1.23.0"
pillow = "^10.2.0"
tiktoken = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
